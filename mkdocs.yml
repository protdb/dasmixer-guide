site_name: DASMixer guide

theme:
  name: material
  favicon: img/favicon.ico
  features:
    - navigation.footer

nav:
  - Home: index.md
  - User guide:
    - Install: installation.md
    - Create project and import data: user/project_sample.md
    - Work with peptides and identifications: user/peptides_tab.md
    - advanced:
        - MaxQuant project import: user/advanced/MaxQuant.md
        - PTM Configuration: user/advanced/ptm_configuration.md
  - Concepts and algorithms:
    - Concepts: concepts.md
    - LFQ Methods: lfq.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - toc:
      toc_depth: 3

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js